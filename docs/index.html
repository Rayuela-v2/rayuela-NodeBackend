<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rayuela Backend Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentation for Rayuela Backend.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- KaTeX CSS for Mathematical Equations -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
  <div id="app"></div>
  <!-- KaTeX JS -->
  <script src="//cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script>
    window.$docsify = {
      name: 'Rayuela Project Docs',
      repo: 'Rayuela-v2/rayuela-NodeBackend',
      loadSidebar: true,
      subMaxLevel: 2,
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Mermaid Plugin -->
  <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false });

    window.$docsify.markdown = {
      renderer: {
        code: function(code, lang) {
          if (lang === "mermaid") {
            return (
              '<div class="mermaid">' + code + "</div>"
            );
          }
          return this.origin.code.apply(this, arguments);
        }
      }
    };

    window.$docsify.plugins = [
      function(hook, vm) {
        // Pre-render LaTeX math ($$...$$ and $...$) with KaTeX before Marked parses underscores/backslashes
        hook.beforeEach(function(markdown) {
          if (typeof katex === 'undefined') return markdown;

          const codeBlocks = [];
          // Protect fenced code blocks and inline code spans from math parsing
          let protectedMd = markdown.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(match) {
            codeBlocks.push(match);
            return '\x00CODEBLOCK_' + (codeBlocks.length - 1) + '\x00';
          });

          // Render display math: $$ ... $$
          protectedMd = protectedMd.replace(/\$\$([\s\S]+?)\$\$/g, function(_, tex) {
            try {
              return katex.renderToString(tex.trim(), { displayMode: true, throwOnError: false });
            } catch (e) {
              return '$$' + tex + '$$';
            }
          });

          // Render inline math: $ ... $
          protectedMd = protectedMd.replace(/\$([^\$\n]+?)\$/g, function(_, tex) {
            try {
              return katex.renderToString(tex.trim(), { displayMode: false, throwOnError: false });
            } catch (e) {
              return '$' + tex + '$';
            }
          });

          // Restore protected code blocks
          return protectedMd.replace(/\x00CODEBLOCK_(\d+)\x00/g, function(_, idx) {
            return codeBlocks[parseInt(idx, 10)];
          });
        });

        hook.doneEach(function() {
          mermaid.init(undefined, '.mermaid');
        });
      }
    ];
  </script>
  <!-- PlantUML Plugin -->
  <script src="//unpkg.com/docsify-plantuml/dist/docsify-plantuml.min.js"></script>
</body>
</html>
